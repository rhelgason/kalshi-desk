# Real orders on Kalshi's DEMO exchange (practice money), for testing the live
# broker before real money. Everything else comes from desk.yaml.
#
#   1. Make a demo account at https://demo.kalshi.co and create an API key there
#   2. In .env: KALSHI_API_KEY_ID=... and KALSHI_PRIVATE_KEY_PATH=~/.kalshi/demo.pem
#   3. python -m desk live-check --config desk.demo.yaml --order
#   4. KALSHI_LIVE_TRADING=yes python -m desk paper --config desk.demo.yaml
#
# It keeps its own local ledger and never touches the shared database.
extends: desk.yaml
env: demo
db_path: data/demo.db
use_database_url: false
trading: live
live:
  max_order_dollars: 40
  max_orders_per_day: 300
  max_daily_loss: 150
  max_drift: 2
