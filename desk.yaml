# Desk configuration (paper trading on live Kalshi data).
# Every key is optional; defaults live in desk/config.py.

env: prod                 # prod = real market data (still paper money). demo = Kalshi's sandbox
db_path: data/desk.db     # the ledger: every paper trade and payout
# The office pool: one pot every employee (except the control group) bets out of,
# like one real Kalshi account. Each bet is a share of it: 1% for an Associate,
# 0.5% Intern, 1.5% Senior, 2% VP/Partner, with at most 3% of the pool in any one
# 15-minute window, no new bets after a 10% down day, and half-size bets while
# the pool is 25% below its high. These live in the HR settings (website).
pool_cash: 1000           # split across the pool's members when a season starts
starting_cash: 1000       # paper dollars for each control-group employee (Dan, Lucky)

tick_seconds: 15          # how often everyone looks at the market
# Bitcoin since Season 3; ETH joined 2026-10-17. Season 5 (2026-10-23) is Steady Stella
# on five coins: a 4,700-rule scan (research/strategy_scan) found her heavy-favorite rule
# the only one that made money in both the 60 days used to pick it and the 30 days after.
# BNB and HYPE are left out: too thin for $10 bets, and they lost in both periods.
# The real book (desk.real.yaml) stays on bitcoin only.
crypto_series: [KXBTC15M, KXETH15M, KXSOL15M, KXXRP15M, KXDOGE15M,
                KXHYPE15M, KXBNB15M, KXNEAR15M, KXZEC15M]   # the last four: 11-02 experiment
slow_series: []
crypto_symbols: [BTC, ETH, SOL, XRP, DOGE, HYPE, BNB, NEAR, ZEC]
crypto_horizon_hours: 1
# Non-coin markets for Wendy and Fiona (2026-10-28, research/other_markets): six cities' daily highs and
# football/baseball/basketball winners. The coin staff never see these, and these two never see the coins.
other_series: [KXHIGHNY, KXHIGHLAX, KXHIGHCHI, KXHIGHMIA, KXHIGHAUS, KXHIGHDEN,
               KXNFLGAME, KXNCAAFGAME, KXMLBGAME, KXNBAGAME]

# The real-money book (its own roster and records) runs beside this one every hosted run
real_book: desk.real.yaml

broad_scan: false         # no general market scan (Wendy and Fiona's series come from other_series)

liquidity_share: 0.5      # assume faster bots take half of every displayed order

# One block per employee. Set enabled: false to give someone the day off.
# A `stake` here no longer sets the bet's dollars: the office pool does (see pool_cash).
# Retired: Risk-Free Rick, Sudoku Sue, Vega Vinny, Front-Runner Fran, Spread Sam, Whale
# Watcher Walt, The Professor, Momentum Mo, Rubber Band Randy, and on 2026-10-24 the
# Sniper, Nickel Nick, the Wet Blanket, Wipeout, Early Bird Edie and the twins Nora,
# Ellie and Bonnie (no edge in the Oct 23 scan). Code kept in desk/strategies.
# Run `python -m desk employees` for the full roster.
#
# research/stella_backtest (2026-10-24): every 15-minute BTC/ETH/SOL market from Dec 2025
# to Oct 2026, replayed like the bot trades. Per $1 bet, the honest numbers:
#   Stella paying the ask           +0.58c (t 3.8, 9 of 11 months up)
#   Sadie's resting bids            +1.53c (t 9.7, 11 of 11), ~+1.2c on the real trade tape
#   the edge is shrinking: ~2c a month early in the year, 0.4c so far in October
# Season 7 (2026-10-26): Steady Sadie alone in the pool, like the real book. research/fast_coco:
# resting bids on 92-99c favorites with 5-9 minutes left made +1.2c per $1 on Kalshi's real trade tape
# (Aug 25 - Oct 25, ETH/SOL/XRP/DOGE, the hosted bot's 2-minute looks), every coin and 9 of 10 weeks up,
# and held with a 3-second delay or none of the queue at our price. Coco's 2-5 minutes was the weakest
# stretch and lost in live paper. Stella, Coco and Sid are benched (code and settings kept).
strategies:
  heavy_favorite:         # 🐜 Steady Stella - 92-99c favorites, 5-9 minutes left, pays the ask (benched)
    enabled: false        # Sadie still uses these settings: she is Stella's patient twin
    min_price: 0.92
    max_price: 0.99
    min_seconds: 300
    max_seconds: 540
    max_spread: 0.02
  heavy_maker:            # 🐌 Steady Sadie - Stella's picks with resting bids (uses Stella's settings)
    enabled: false        # 10-31: retired; her season-7 bets and money went to the coin specialists below
    odds_margin: 0.0      # skip a bid when the coin's price gives her side worse odds than her bid (10-27)
    coins: []             # (if ever back on staff, she mustn't double the specialists' bets)
  # Sadie's rules, one coin each (2026-10-31): they take Sadie's settings (hr.TWINS), so tune her, not them
  maker_btc: {}           # 🐝 Bitcoin Bea
  maker_eth: {}           # 🦢 Ether Esther
  maker_sol: {}           # ☀️ Solar Sally
  maker_xrp: {}           # 🌊 Ripple Rita
  maker_doge: {}          # 🐕 Dogecoin Dot
  # 11-02: four thinner 15-minute coins, to see whether Sadie's rules carry over (Training only)
  maker_hype: {}          # 📣 Hype Hannah
  maker_bnb: {}           # 🔔 Binance Belle
  maker_near: {}          # 🧭 Nearly Nadia
  maker_zec: {}           # 🕶️ Zcash Zoe
  late_maker: {enabled: false}       # 🦉 Closing Time Coco - 94-99c, 2-5 minutes left (benched)
  runner_up_maker: {enabled: false}  # 🥈 Silver Medal Sid - 85-92c, 5-13 minutes left (benched)
  # 2026-10-28: Sadie's idea outside the coins, on Training only (research/other_markets/README.md)
  weather_maker:          # 🌤️ Weather Wendy - 92-99.5c daily-high favorites, midnight to 6 am city time
    min_price: 0.92
    max_price: 0.995
    end_hour: 6           # 11-02: two years of trades (wx_years.py): 0-6 am +1.48c per $1 (t 5.4, both years, all 6
                          # cities up) vs 0-11 am +0.83c; 6-11 am adds +0.64c and the evening before +0.40c
  sports_closer:          # 🏁 Final Whistle Fiona - 97-99.5c game winners in the last 3 h to 2 h after (+1.2-1.7c replayed)
    min_price: 0.97
    max_price: 0.995
  longshot_buy:           # 🐦 Lucky the Pigeon - control group: buys long shots
    max_days: 2
    stake: 2
  dart_monkey:            # 🐒 Dart Monkey Dan - control group: random bets; the benchmark to beat
    bets_per_tick: 0.2
    max_hours: 24
    stake: 3
