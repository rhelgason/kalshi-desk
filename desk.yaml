# Desk configuration (paper trading on live Kalshi data).
# Every key is optional; defaults live in desk/config.py.

env: prod                 # prod = real market data (still paper money). demo = Kalshi's sandbox
db_path: data/desk.db     # the ledger: every paper trade and payout
# The office pool: one pot every employee (except the control group) bets out of,
# like one real Kalshi account. Each bet is a share of it: 1% for an Associate,
# 0.5% Intern, 1.5% Senior, 2% VP/Partner, with at most 3% of the pool in any one
# 15-minute window, no new bets after a 10% down day, and half-size bets while
# the pool is 25% below its high. These live in the HR settings (website).
pool_cash: 1000           # split across the pool's members when a season starts
starting_cash: 1000       # paper dollars for each control-group employee (Dan, Lenny)

tick_seconds: 15          # how often everyone looks at the market
# Bitcoin since Season 3: "will BTC be up in 15 minutes?" markets settle 96x a
# day, the only market family that made money in Seasons 1-2, and the one with
# months of history to backtest on. ETH's 15-minute markets joined 2026-10-17
# (pretend money): same rules, fees and exchange shard, about 1/15th the trading.
# Tuning and backtests still use bitcoin only (desk/autotune.py TUNE_SERIES).
crypto_series: [KXBTC15M, KXETH15M]
slow_series: []
crypto_symbols: [BTC, ETH]
crypto_horizon_hours: 1

broad_scan: false         # no sports, weather, or other non-bitcoin markets

liquidity_share: 0.5      # assume faster bots take half of every displayed order

# One block per employee (the bitcoin team). Set enabled: false to give someone the day off.
# A `stake` here no longer sets the bet's dollars: the office pool does (see pool_cash).
# Retired with the bitcoin focus: Risk-Free Rick, Sudoku Sue, Vega Vinny,
# Front-Runner Fran, Spread Sam, Whale Watcher Walt, and (no edge on 15-minute
# bitcoin) The Professor, Momentum Mo, Rubber Band Randy. Code kept in desk/strategies.
# Run `python -m desk employees` for the full roster.
#
# Settings marked TUNED came from `python -m desk tune` (30 days of 15-minute
# BTC/ETH/SOL markets, 1-minute fill delay) and were profitable in BOTH the
# training period and the unseen test period. PROBATION means no tested
# setting made money, so the employee only bets on rare, very strong signals.
strategies:
  sniper:                 # 🎯 The Sniper - LOOSENED 10-17 (pretend money): 90%+ sure, last 10 minutes.
    min_win_prob: 0.90    # was 0.97 / last 5 min: one idea in 6 hours, no bets all season
    max_seconds: 600
    vol_multiplier: 1.25
    min_edge: 0.01
    min_price: 0.75
    max_bet: 50
  longshot_fade:          # 🧊 Buzzkill Bill - TUNED: fade 5-15c long shots, never in the last 10 minutes
    min_yes: 0.05
    max_yes: 0.15
    min_seconds: 600
    max_days: 2
    stake: 5
  longshot_buy:           # 🎰 Long Shot Lenny - control group: buys the long shots Bill fades
    max_days: 2
    stake: 2
  nickel_picker:          # 🪙 Nickel Nick - TUNED: 88-95c favorites, never in the last 10 minutes
    min_price: 0.88
    max_price: 0.95
    min_seconds: 600
    stake: 10
  breakout:               # 🏄‍♀️ Breakout Betty - NEW (Season 3), probation: rides 0.2%+ moves early in a window
    min_move: 0.002       # backtest Aug-Oct: lost in the first 2/3, won in the last 1/3 (+$56 overall)
    max_price: 0.60
  early_favorite:         # 🐦 Early Bird Edie - NEW (Season 3), probation: 75-85c favorites in the first 5 minutes
    min_price: 0.75       # backtest Aug-Oct: +$132 train / +$11 test; the edge may be fading
    max_seconds: 780
  # The patient twins (Season 3, week 2): same picks as Nick, Edie and Betty, but they post a
  # bid and wait instead of paying the ask. No fee when someone fills them. They use their
  # sibling's settings automatically (including autotune's changes), so the only difference
  # is how they buy; anything set here for a twin applies on top (desk/hr.py TWINS).
  # 55-day replay on Kalshi's minute candles, per $1 bet (taker -> patient twin):
  #   Edie +1.3c -> +1.6c, Nick +3.6c -> +3.8c, Betty -0.2c -> +3.2c (noisy)
  nickel_maker: {}        # 🐢 Nickel Nora: Nick's picks, resting bids
  early_maker: {}         # 🐣 Early Bird Ellie: Edie's picks, resting bids
  breakout_maker: {}      # 🛶 Breakout Bonnie: Betty's picks, resting bids
  dart_monkey:            # 🐒 Dart Monkey Dan - control group: random bets; the benchmark to beat
    bets_per_tick: 0.2
    max_hours: 24
    stake: 3
