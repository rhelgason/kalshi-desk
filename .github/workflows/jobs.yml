name: desk jobs

# History sync, archive backfill, and autotuning for Kalshi Desk.
# Runs every 3 hours; each run checks the database to decide whether autotuning
# is due (daily by default) or was requested from the website.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force_tune:
        description: "Retune now regardless of schedule"
        type: boolean
        default: false

concurrency:
  group: desk-jobs
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run desk jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m desk jobs --backfill-minutes 12 ${{ inputs.force_tune && '--force-tune' || '' }}
