name: desk jobs

# History sync, archive backfill, and autotuning for Kalshi Desk.
# Runs every 6 hours (about 1,300 of a private repo's 2,000 free minutes a
# month); each run checks the database to decide whether autotuning is due
# (daily by default) or was requested from the website. Then a health check
# fails the run (GitHub emails you) if the bot has stopped reporting.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force_tune:
        description: "Retune now regardless of schedule"
        type: boolean
        default: false

concurrency:
  group: desk-jobs
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run desk jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m desk jobs --backfill-minutes 8 ${{ inputs.force_tune && '--force-tune' || '' }}
      - name: Is the bot still running?
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m desk health
